apiVersion: v1
kind: Service
metadata:
  name: musically-client-service
spec:
  type: NodePort
  selector:
    app: musically   # Match this with the label in your deployment
  ports:
    - protocol: TCP
      port: 3000         # Port that your application listens on
      targetPort: 3000   # Port on the container
      nodePort: 30001    # The port on the node (optional, Kubernetes will allocate one if not specified)
